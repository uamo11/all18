    </header>

    <div class="main-wrapper">
        <main class="main-content">
            <div id="mediaGrid" class="media-grid"></div>
            <div class="pagination-wrapper" style="text-align: center; padding: 24px;">
                <button id="btnLoadMore" class="btn-load-more" type="button" onclick="window.loadMoreVideos && window.loadMoreVideos()">
                    Cargar más videos

    <!-- Theme Selector Modal -->
    <div id="themeModal" class="theme-modal-backdrop" onclick="window.closeThemeModal(event)">
        <div class="theme-modal-sheet" onclick="event.stopPropagation()">
            <div class="theme-modal-header">

                </div>
                <button class="theme-modal-close" type="button" onclick="window.closeThemeModal(event)" style="background: rgba(255,255,255,0.1); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; font-weight: 700;">✕</button>
            </div>
            <div class="theme-modal-list">

                </button>
                <button class="theme-modal-item active" data-theme="onlyfans" type="button" onclick="window.location.href='onlyfans.html'">
                    <div class="theme-item-icon" style="background: linear-gradient(135deg, #00aff0, #0080c0); color: #fff; font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center;">OF</div>

                    <div class="theme-item-info">
                        <strong>Instagram / Reels</strong>
                        <span>Degradado rosa y morado</span>
                    </div>
                    <span class="theme-item-check" style="font-weight: 900; font-size: 16px;">✓</span>
                </button>
                <button class="theme-modal-item" data-theme="tiktok" type="button" onclick="window.location.href='tiktok.html'">
                    <div class="theme-item-icon" style="background: linear-gradient(135deg, #00f2fe, #fe0979); color: #000; font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center;">TT</div>

                <button class="theme-modal-item" data-theme="twitter" type="button" onclick="window.location.href='twitter.html'">
                    <div class="theme-item-icon" style="background: #000; border: 1px solid #333; color: #fff; font-weight: 900; font-size: 15px; display: flex; align-items: center; justify-content: center;">𝕏</div>
                    <div class="theme-item-info">
                        <strong>X / Twitter Timeline</strong>
                        <span>Feed cronológico negro puro</span>
                    </div>
                    <span class="theme-item-check" style="font-weight: 900; font-size: 16px;">✓</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/app.js?v=9.0"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof window.applyTheme === 'function') window.applyTheme('onlyfans', false);
