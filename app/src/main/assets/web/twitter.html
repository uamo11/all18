    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof window.applyTheme === 'function') {
                window.applyTheme('twitter', false);
            }
            if (typeof window.loadVideos === 'function') {
                window.loadVideos(1, true);
            }
            
            // Sync user avatar on header
            try {
                const saved = localStorage.getItem('all18_user_profile');
                if (saved) {
                    const p = JSON.parse(saved);
                    const el = document.getElementById('xUserAvatar');
                    if (el && p.photoURL) el.src = p.photoURL;
                }
            } catch(e) {}
        });

        window.switchXTab = function(tabName, btnEl) {
            document.querySelectorAll('.x-tab-btn').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            if (tabName === 'foryou') {
                window.state.source = 'all';
                window.state.query = '';
                window.loadVideos(1, true);
            } else if (tabName === 'following') {
                window.state.source = 'user_posts';
                window.state.query = '';
                window.loadVideos(1, true);
            } else if (tabName === 'photos') {
                window.state.source = 'photos';
                window.state.query = '';
                window.loadVideos(1, true);
            } else if (tabName === 'nsfw') {
                window.state.source = 'redgifs';
                window.state.query = 'amateur';
                window.loadVideos(1, true);
            }
        };
